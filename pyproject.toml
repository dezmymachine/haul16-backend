[project]
name = "haul16"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "dnspython>=2.9.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "idna>=3.20",
    "imagehash>=4.3.2",
    "mmh3>=5.3.1",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
